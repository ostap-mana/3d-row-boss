<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="mraid.js"></script>
    <script>
      (function () {
        var latch = { ready: false, waiting: [] };
        window.__siegeMraid = latch;

        function fire() {
          if (latch.ready) return;
          latch.ready = true;
          var queue = latch.waiting;
          latch.waiting = [];
          for (var i = 0; i < queue.length; i++) {
            try {
              queue[i]();
            } catch (e) {}
          }
        }

        var m = null;
        try {
          m = window.mraid;
        } catch (e) {}
        if (!m || typeof m.addEventListener !== "function") {
          fire();
          return;
        }

        try {
          m.addEventListener("ready", fire);
        } catch (e) {}
        try {
          if (typeof m.getState === "function" && m.getState() !== "loading") {
            fire();
          }
        } catch (e) {
          fire();
        }
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="applovin:click" content="{{APPLOVIN_CLICK_URL}}" />
    <meta name="applovin:click-tracker" content="{{APPLOVIN_CLICK_TRACKER}}" />
    <meta name="applovin:impression" content="{{APPLOVIN_IMPRESSION_URL}}" />
    <meta name="applovin:start" content="{{APPLOVIN_START_URL}}" />
    <meta name="applovin:viewable" content="{{APPLOVIN_VIEWABLE_URL}}" />
    <meta name="applovin:engagement" content="{{APPLOVIN_ENGAGEMENT_URL}}" />
    <meta name="applovin:interaction" content="{{APPLOVIN_INTERACTION_URL}}" />
    <meta name="applovin:ultimate" content="{{APPLOVIN_ULTIMATE_URL}}" />
    <meta name="applovin:complete" content="{{APPLOVIN_COMPLETE_URL}}" />
    <meta name="applovin:endcard" content="{{APPLOVIN_ENDCARD_URL}}" />
    <meta name="applovin:replay" content="{{APPLOVIN_REPLAY_URL}}" />
    <title>Elemental Siege</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        height: 100svh;
        overflow: hidden;
        background: #05030a;
        touch-action: none;
        overscroll-behavior: none;
        position: fixed;
        top: 0;
        left: 0;
      }

      #pixi-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      #pixi-container canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        touch-action: none;
      }

      #safe-probe {
        position: fixed;
        inset: 0;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
    </style>
  </head>

  <body>
    <div id="safe-probe"></div>
    <div id="pixi-container"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
