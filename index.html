<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>Elemental Siege</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05030a;
        touch-action: none;
        overscroll-behavior: none;
        position: fixed;
        top: 0;
        left: 0;
      }

      #pixi-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #pixi-container canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }

      /*
       * Safe-area probe.
       *
       * `viewport-fit=cover` has been set since the first build, which is what
       * lets the canvas run under a notch — and nothing ever read the insets
       * back, so the boss name and the doom clock were laid out under the
       * cutout and the hero row's health bars under the home indicator.
       *
       * Read as real padding on a hidden element rather than as a custom
       * property. `--x: env(safe-area-inset-top)` looks tidier, but
       * getPropertyValue hands back the unresolved `env(...)` token on some
       * webviews; a computed padding is a used value everywhere.
       */
      #safe-probe {
        position: fixed;
        inset: 0;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }

      /* Shown until the first frame renders — the ad slot must never flash white. */
      #boot {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 60%, #2a0f1c 0%, #05030a 70%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        color: #ff8a3d;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 3px;
      }

      #boot span {
        animation: pulse 1.1s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div id="safe-probe"></div>
    <div id="pixi-container"></div>
    <div id="boot"><span>ELEMENTAL SIEGE</span></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
