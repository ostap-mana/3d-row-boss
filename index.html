<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The container's own API — and the only request this one file is allowed
      to make. See src/net/mraid.js: the SDK the ad plays inside intercepts
      this URL and answers it with its own build, and a few of them inject
      nothing unless it is asked for. First in the head and not deferred,
      because nothing may read window.mraid before it exists. Standalone it
      404s, which is silent, and is the case every path in net/cta.js covers.
    -->
    <script src="mraid.js"></script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>Elemental Siege</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      /*
       * This background is the whole of the no-white-flash guarantee: it applies
       * before a byte of script runs and it is the colour the renderer clears to.
       * A splash used to sit over it and was never what held the flash off — do
       * not put another one back for that reason.
       */
      html,
      body {
        width: 100%;
        /*
         * Three declarations of the same height, in the order the browsers that
         * understand them arrived. `100%` of a fixed body resolves against the
         * initial containing block, which on a mobile browser is the viewport
         * with the URL bar retracted whether it is retracted or not — so on its
         * own it puts the bottom of the page under a toolbar. `100dvh` is that
         * same height measured honestly, and every engine since 2022 has it.
         * A browser that has neither takes the first line and is corrected by
         * core/viewport.js on the first frame; the fallbacks are what stops it
         * being visibly wrong for that frame.
         */
        height: 100%;
        height: 100dvh;
        height: 100svh;
        overflow: hidden;
        background: #05030a;
        touch-action: none;
        overscroll-behavior: none;
        position: fixed;
        top: 0;
        left: 0;
      }

      /*
       * Pre-script defaults only. core/viewport.js pins this box to a measured
       * size in pixels on the first frame and on every resize after it — these
       * are what it looks like until then, and they are written to match what
       * the pin sets so that nothing moves when it lands.
       */
      #pixi-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      #pixi-container canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        /*
         * The canvas is the thing under the finger, and a gesture that starts
         * on it must never be handed to the browser as a scroll or a
         * double-tap zoom — a swipe on the board is a move. The rule is on
         * html and body already; it is repeated here because a canvas is a
         * replaced element and some webviews do not inherit it onto one.
         */
        touch-action: none;
      }

      /*
       * Safe-area probe.
       *
       * `viewport-fit=cover` has been set since the first build, which is what
       * lets the canvas run under a notch — and nothing ever read the insets
       * back, so the boss name and the doom clock were laid out under the
       * cutout and the hero row's health bars under the home indicator.
       *
       * Read as real padding on a hidden element rather than as a custom
       * property. `--x: env(safe-area-inset-top)` looks tidier, but
       * getPropertyValue hands back the unresolved `env(...)` token on some
       * webviews; a computed padding is a used value everywhere.
       */
      #safe-probe {
        position: fixed;
        inset: 0;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
    </style>
  </head>

  <body>
    <div id="safe-probe"></div>
    <div id="pixi-container"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
